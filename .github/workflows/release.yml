name: Build Android release candidates

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  EXPO_PUBLIC_MONETIZATION_ENABLED: 'false'

jobs:
  build-test-and-publish-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate committed release metadata
        run: node scripts/validate-release.mjs --release --tag "$GITHUB_REF_NAME"

      - name: Validate Google Play listing assets
        run: npm run validate:store

      - name: Run release quality gates
        run: |
          npm run typecheck
          npm test
          npm run doctor
          npm run smoke:api
          npx expo export --platform android --output-dir "$RUNNER_TEMP/android-export"

      - name: Set up Expo and pinned EAS CLI
        uses: expo/expo-github-action@9.0.0
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Play App Bundle
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > "$RUNNER_TEMP/aab-build.json"
          jq -e 'type == "array" and length == 1 and .[0].status == "FINISHED"' "$RUNNER_TEMP/aab-build.json"
          echo "AAB_BUILD_ID=$(jq -r '.[0].id' "$RUNNER_TEMP/aab-build.json")" >> "$GITHUB_ENV"
          echo "AAB_URL=$(jq -r '.[0].artifacts.buildUrl' "$RUNNER_TEMP/aab-build.json")" >> "$GITHUB_ENV"
          echo "AAB_VERSION_CODE=$(jq -r '.[0].appBuildVersion' "$RUNNER_TEMP/aab-build.json")" >> "$GITHUB_ENV"

      - name: Download Play App Bundle
        run: curl --fail --location --retry 3 "$AAB_URL" --output "$RUNNER_TEMP/siphon-${GITHUB_REF_NAME}.aab"

      - name: Build GitHub APK with matching remote version
        run: |
          eas build --platform android --profile production-github --non-interactive --wait --json > "$RUNNER_TEMP/apk-build.json"
          jq -e 'type == "array" and length == 1 and .[0].status == "FINISHED"' "$RUNNER_TEMP/apk-build.json"
          echo "APK_BUILD_ID=$(jq -r '.[0].id' "$RUNNER_TEMP/apk-build.json")" >> "$GITHUB_ENV"
          echo "APK_URL=$(jq -r '.[0].artifacts.buildUrl' "$RUNNER_TEMP/apk-build.json")" >> "$GITHUB_ENV"
          echo "APK_VERSION_CODE=$(jq -r '.[0].appBuildVersion' "$RUNNER_TEMP/apk-build.json")" >> "$GITHUB_ENV"

      - name: Download and verify GitHub APK
        run: |
          curl --fail --location --retry 3 "$APK_URL" --output "$RUNNER_TEMP/siphon-${GITHUB_REF_NAME}.apk"
          test "$AAB_VERSION_CODE" = "$APK_VERSION_CODE" || {
            echo "AAB versionCode $AAB_VERSION_CODE does not match APK versionCode $APK_VERSION_CODE"
            exit 1
          }
          cd "$RUNNER_TEMP"
          sha256sum "siphon-${GITHUB_REF_NAME}.apk" "siphon-${GITHUB_REF_NAME}.aab" > "siphon-${GITHUB_REF_NAME}-SHA256SUMS.txt"

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/siphon-${{ github.ref_name }}.apk
            ${{ runner.temp }}/siphon-${{ github.ref_name }}.aab
            ${{ runner.temp }}/siphon-${{ github.ref_name }}-SHA256SUMS.txt

      - name: Submit exact AAB to Play internal testing
        if: vars.PLAY_SUBMIT_ENABLED == 'true'
        run: eas submit --platform android --profile internal --id "$AAB_BUILD_ID" --non-interactive --wait
