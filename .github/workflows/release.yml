name: Release APK and Submit to Play Store

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-cli-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must be vX.Y.Z"; exit 1; }
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
          PATCH="${VERSION##*.}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" --argjson vc "$VERSION_CODE" --arg bn "$VERSION" \
            '.version=$v | .android.versionCode=$vc | .ios.buildNumber=$bn' \
            app.json > app.json.tmp && mv app.json.tmp app.json

      - name: Build Android APK (for GitHub Release)
        run: eas build --platform android --profile preview --non-interactive --output "$RUNNER_TEMP/siphon.apk"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ runner.temp }}/siphon.apk

      - name: Build Android AAB (for Play Store)
        # Temporarily modify app.json to mark this as a store build
        # This will gate the GitHub update check in useAppUpdate.ts
        run: |
          jq '.expo.extra.distribution = "playstore"' app.json > app.json.tmp && mv app.json.tmp app.json
          eas build --platform android --profile production --non-interactive --output "$RUNNER_TEMP/siphon.aab"

      - name: Submit to Play Store
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          eas submit --platform android --non-interactive

      - name: Restore app.json (optional, for cleanliness)
        run: |
          jq '.expo.extra.distribution = "github"' app.json > app.json.tmp && mv app.json.tmp app.json